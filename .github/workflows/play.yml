name: Google Play - AAB para faixa de teste

# Envio: Actions > "Google Play - AAB para faixa de teste" > Run workflow (escolha branch e faixa),
# ou empurrando uma tag play-* (faixa interna). Push em feature/play-* so compila o AAB (sem envio).
on:
  workflow_dispatch:
    inputs:
      faixa:
        description: 'Faixa do Play (internal = teste interno, alpha = teste fechado, beta = teste aberto)'
        type: choice
        options: [internal, alpha, beta]
        default: internal
      status:
        description: 'completed = disponivel aos testadores; draft = aguarda liberacao no Console'
        type: choice
        options: [completed, draft]
        default: completed
      notas:
        description: 'Notas da versao (pt-BR, ate 500 caracteres; vazio = mensagem do commit)'
        type: string
        default: ''
  push:
    tags: ['play-*']
    branches: ['feature/play-*']

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENVIAR: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/play-') }}
    steps:
      - uses: actions/checkout@v6

      # versionCode do Play: sempre crescente e acima dos APKs do GitHub (que usam 22, 23...).
      - name: versionCode do Play
        run: echo "PV_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35 / build-tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Restaurar chave de upload do Play (segredo)
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > signing/upload.keystore
            echo "PLAY_SIGNED=1" >> "$GITHUB_ENV"
          elif [ "$ENVIAR" = "true" ]; then
            echo "::error::Segredo PLAY_UPLOAD_KEYSTORE_BASE64 ausente: o Play recusa AAB sem a chave de upload."; exit 1
          else
            echo "::warning::Sem chave de upload: compilando AAB nao assinado so para verificar o build."
          fi

      - name: Compilar AAB de release
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Conferir AAB
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "AAB=$AAB" >> "$GITHUB_ENV"; echo "VN=$VN" >> "$GITHUB_ENV"
          if [ "${PLAY_SIGNED:-0}" = "1" ]; then
            CERT=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
            [ -n "$CERT" ] || { echo "::error::AAB sem assinatura."; exit 1; }
          fi
          echo "::notice title=AAB::PelotaVision ${VN} · versionCode ${PV_VERSION_CODE} · $(du -h "$AAB" | cut -f1) · cert upload ${CERT:-nao assinado} · sha256 $(sha256sum "$AAB" | cut -c1-64)"

      - uses: actions/upload-artifact@v6
        with:
          name: PelotaVision-aab-${{ env.PV_VERSION_CODE }}
          path: ${{ env.AAB }}
          retention-days: 30

      - name: Enviar ao Google Play
        if: env.ENVIAR == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FAIXA: ${{ inputs.faixa || 'internal' }}
          STATUS: ${{ inputs.status || 'completed' }}
          NOTAS: ${{ inputs.notas }}
        run: |
          pip install --quiet google-auth requests
          [ -n "$NOTAS" ] || NOTAS=$(git log -1 --format=%s)
          python3 tools/play_upload.py "$AAB" --track "$FAIXA" --status "$STATUS" --name "${VN} (${PV_VERSION_CODE})" --notes "$NOTAS"
