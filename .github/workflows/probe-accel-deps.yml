name: probe-accel-deps (temporario)
on:
  push:
    branches: [probe/aceleracao-deps]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: versions
        run: |
          touch out.txt
      - name: inspect
        run: |
          set +e
          exec > >(tee -a $GITHUB_WORKSPACE/out.txt) 2>&1
          mkdir w && cd w
          B=https://dl.google.com/android/maven2/com/google/ai/edge/litert
          get(){ curl -sSLf -o $1-$2.aar $B/$1/$2/$1-$2.aar && mkdir -p $1-$2 && (cd $1-$2 && unzip -q -o ../$1-$2.aar); }
          for x in "litert 1.4.2" "litert-gpu 1.4.2" "litert-gpu-api 1.4.2" "litert-api 1.4.2" "litert 2.3.2" "litert-gpu 2.3.2" "litert-api 2.3.2"; do set -- $x; get $1 $2; echo "== $1-$2 files:"; (cd $1-$2 && find . -type f | grep -v -E "res/|\.class$" | tr '\n' ' '); echo; curl -s $B/$1/$2/$1-$2.pom | grep -E "<artifactId>|<version>" | tr -d ' ' | paste -sd' '; done
          echo "== ELF p_align (16KB=0x4000) por .so"
          python3 - <<'P'
          import glob,struct
          for f in sorted(glob.glob('*/jni/arm64-v8a/*.so')):
              d=open(f,'rb').read(); phoff=struct.unpack_from('<Q',d,0x20)[0]; n=struct.unpack_from('<H',d,0x38)[0]
              al=[struct.unpack_from('<Q',d,phoff+i*56+48)[0] for i in range(n) if struct.unpack_from('<I',d,phoff+i*56)[0]==1]
              print(f, 'LOAD align', sorted(set(al)))
          P
          for c in org.tensorflow.lite.gpu.GpuDelegate org.tensorflow.lite.gpu.CompatibilityList 'org.tensorflow.lite.gpu.GpuDelegate$Options' 'org.tensorflow.lite.InterpreterApi$Options' 'org.tensorflow.lite.Interpreter$Options'; do
            for a in litert-1.4.2 litert-gpu-1.4.2 litert-gpu-api-1.4.2 litert-api-1.4.2; do [ -f $a/classes.jar ] && javap -cp $a/classes.jar "$c" 2>/dev/null | grep -E "public" | grep -v -E "^Compiled" | tr '\n' ' ' && echo " ^^ $c em $a"; done
          done
          for c in com.google.ai.edge.litert.CompiledModel 'com.google.ai.edge.litert.CompiledModel$Options' 'com.google.ai.edge.litert.CompiledModel$Companion' com.google.ai.edge.litert.Accelerator com.google.ai.edge.litert.Environment 'com.google.ai.edge.litert.Environment$Companion' com.google.ai.edge.litert.TensorBuffer; do
            for a in litert-2.3.2 litert-api-2.3.2 litert-gpu-2.3.2; do [ -f $a/classes.jar ] && javap -cp $a/classes.jar "$c" 2>/dev/null | grep public | tr '\n' ' ' && echo " ^^ $c em $a"; done
          done
      - name: notas 0
        if: always()
        run: |
          python3 - <<'P'
          t=open('out.txt').read().replace('\n',' ¶ ')
          ch=[t[k:k+850] for k in range(0,len(t),850)]
          for c in ch[0:10]: print('::notice title=probe::'+c)
          P
      - name: notas 1
        if: always()
        run: |
          python3 - <<'P'
          t=open('out.txt').read().replace('\n',' ¶ ')
          ch=[t[k:k+850] for k in range(0,len(t),850)]
          for c in ch[10:20]: print('::notice title=probe::'+c)
          P
      - name: notas 2
        if: always()
        run: |
          python3 - <<'P'
          t=open('out.txt').read().replace('\n',' ¶ ')
          ch=[t[k:k+850] for k in range(0,len(t),850)]
          for c in ch[20:30]: print('::notice title=probe::'+c)
          P
      - name: notas 3
        if: always()
        run: |
          python3 - <<'P'
          t=open('out.txt').read().replace('\n',' ¶ ')
          ch=[t[k:k+850] for k in range(0,len(t),850)]
          for c in ch[30:40]: print('::notice title=probe::'+c)
          P
      - name: notas 4
        if: always()
        run: |
          python3 - <<'P'
          t=open('out.txt').read().replace('\n',' ¶ ')
          ch=[t[k:k+850] for k in range(0,len(t),850)]
          for c in ch[40:50]: print('::notice title=probe::'+c)
          P
      - name: notas 5
        if: always()
        run: |
          python3 - <<'P'
          t=open('out.txt').read().replace('\n',' ¶ ')
          ch=[t[k:k+850] for k in range(0,len(t),850)]
          for c in ch[50:60]: print('::notice title=probe::'+c)
          P
