name: Crack pipeline (Python tests)
on:
  pull_request:
    paths: ['tools/**', 'ml_training/**', 'docs/datasets/**', 'app/src/main/assets/crack_forest.pvrf', '.github/workflows/crack-pipeline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r tools/cracks/requirements.txt pytest
      - run: python -m pytest tools/tests -q
