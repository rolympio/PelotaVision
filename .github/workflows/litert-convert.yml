name: LiteRT - converter modelos e medir paridade

# Converte os ONNX embarcados para .tflite (Android + GPU via LiteRT) e mede a paridade com o
# onnxruntime. Grava os .tflite e os .tflite.json em app/src/main/assets e o relatório em
# verification/litert-0.16.0, com commit na própria branch.
on:
  push:
    paths: ['tools/litert/**', '.github/workflows/litert-convert.yml', 'app/src/main/assets/*.onnx']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: litert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          pip install -q "numpy<2.3" scipy opencv-python-headless==4.12.0.88 onnx onnxruntime \
            tensorflow tf_keras onnx2tf onnx_graphsurgeon sng4onnx psutil ai-edge-litert protobuf 2>&1 | tail -3
          pip list 2>/dev/null | grep -iE "^(onnx|onnx2tf|tensorflow|ai-edge-litert|onnxruntime|numpy) "
      - name: Converter e medir paridade
        id: conv
        run: |
          set +e
          python -u tools/litert/convert_tflite.py --out verification/litert-0.16.0 > /tmp/conv.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          tail -c 200000 /tmp/conv.txt > verification/litert-0.16.0/run_stdout.txt
          exit 0
      - name: Resumo (anotações)
        if: always()
        run: |
          python - <<'P'
          import json
          r = json.load(open('verification/litert-0.16.0/litert_conversion.json'))
          print('::notice title=Versões::' + json.dumps(r['versions']))
          for m in r['models']:
              if 'error' in m:
                  print('::error title=' + m['model'] + '::' + m['error'][-900:].replace('\n', ' | ')); continue
              p = dict(m.get('parity_float32', {})); det = p.pop('detection', None)
              print('::notice title=' + m['model'] + ' fp32::aceito=%s layout=%s %s' % (m.get('accepted'), m.get('output_layout'), json.dumps(p)))
              if det: print('::notice title=' + m['model'] + ' deteccao::' + json.dumps(det)[:900])
          P
          tail -c 1500 /tmp/conv.txt | tr '\n' ' ' | sed 's/^/::notice title=stdout::/'
      - name: Gravar na branch
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la app/src/main/assets/*.tflite* 2>&1 | sed 's/^/::notice title=assets::/'
          git add -A app/src/main/assets/ verification/litert-0.16.0 > /tmp/git.txt 2>&1
          git status --short | head -20 | tr '\n' ' ' | sed 's/^/::notice title=git status::/'; echo
          git commit -q -m "LiteRT: modelos .tflite convertidos no CI e paridade com o ONNX (rc ${{ steps.conv.outputs.rc }}) [skip ci]" >> /tmp/git.txt 2>&1 || { echo "::notice title=git::nada a gravar"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" >> /tmp/git.txt 2>&1 && git push origin "HEAD:${GITHUB_REF_NAME}" >> /tmp/git.txt 2>&1 && { echo "::notice title=git::gravado na branch"; exit 0; }
            sleep 5
          done
          echo "::error title=git push::$(tail -c 900 /tmp/git.txt | tr '\n' ' ')"
          exit 1
      - name: Falha se não houve paridade
        if: steps.conv.outputs.rc != '0'
        run: exit 1
