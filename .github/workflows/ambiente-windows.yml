name: Infraestrutura Windows e inventario
on:
  pull_request:
    paths: ['*.bat', 'tools/windows/**', 'tools/dataset/**', '.opencode/**', 'opencode.jsonc', '.github/workflows/ambiente-windows.yml']
  push:
    branches: [main]
    paths: ['*.bat', 'tools/windows/**', 'tools/dataset/**', '.github/workflows/ambiente-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seguranca:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar guardas de atualizacao
        shell: powershell
        run: ./tools/windows/test_seguranca.ps1
      - name: Testar atualizacao em repositorios sinteticos locais
        shell: powershell
        run: ./tools/windows/test_integracao.ps1
      - name: Testar inventario sem dados privados
        run: python -m unittest discover -s tools/dataset -p "test_*.py" -v
