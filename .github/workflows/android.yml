name: Android - compilar, testar e empacotar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar o APK como Release (download direto)'
        type: boolean
        default: true

permissions:
  contents: write   # necessario para criar a Release com o APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Certificado da chave que assinou a 0.11.0 (versionCode 14).
      PV_EXPECTED_CERT_SHA256: 0d77d2917bd808a17f92e52568dbb6bc2b1767be0e25ca93fadc8e41c8d66b38
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35 / build-tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Restaurar chave de desenvolvimento (segredo)
        env:
          PV_KEYSTORE_BASE64: ${{ secrets.PV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PV_KEYSTORE_BASE64" ]; then
            echo "$PV_KEYSTORE_BASE64" | base64 -d > signing/prototype.keystore
            echo "PV_SIGNED=1" >> "$GITHUB_ENV"
            echo "Chave restaurada."
          else
            echo "::warning::Segredo PV_KEYSTORE_BASE64 ausente. O APK sera assinado com chave debug temporaria e NAO atualiza a 0.11.0 instalada."
          fi

      - name: Compilar, testar e lint
        env:
          PV_STORE_PASSWORD: ${{ secrets.PV_STORE_PASSWORD }}
          PV_KEY_PASSWORD: ${{ secrets.PV_KEY_PASSWORD }}
          PV_KEY_ALIAS: ${{ secrets.PV_KEY_ALIAS }}
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Conferir assinatura do APK
        if: always()
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p ci-report
          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            sha=$("$APKSIGNER" verify --print-certs "$apk" | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
            echo "$(basename "$apk") $sha" | tee -a ci-report/assinatura.txt
            echo "::notice title=Assinatura $(basename "$apk")::cert=$sha apk_sha256=$(sha256sum "$apk" | cut -c1-64) chave_oficial=${PV_SIGNED:-0}"
            if [ "${PV_SIGNED:-0}" = "1" ] && [ "$sha" != "$PV_EXPECTED_CERT_SHA256" ]; then
              echo "::error::Certificado de $apk difere da chave da 0.11.0"; exit 1
            fi
          done
          sha256sum app/build/outputs/apk/debug/*.apk | tee ci-report/apk_sha256.txt || true

      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY" ci-report/resumo.md
          import sys, glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print(f"## Testes unitarios\n\nTotal {t} | falhas {f} | erros {e} | ignorados {s}\n")
          print(f"::notice title=Testes::total={t} falhas={f} erros={e} ignorados={s}", file=sys.stderr)
          for p in glob.glob('app/build/reports/lint-results-debug.xml'):
              issues=ET.parse(p).getroot().findall('issue')
              sev={}
              for i in issues: sev[i.get('severity')]=sev.get(i.get('severity'),0)+1
              txt=", ".join(f"{k}: {v}" for k,v in sorted(sev.items())) or "sem ocorrencias"
              print("## Lint\n\n"+txt+"\n")
              print(f"::notice title=Lint::{txt}", file=sys.stderr)
          EOF

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: PelotaVision-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            ci-report/
          retention-days: 30

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios-${{ github.sha }}
          path: |
            ci-report/
            app/build/reports/
            app/build/test-results/
          retention-days: 30

      - name: Publicar Release (APK para download direto)
        if: success() && env.PV_SIGNED == '1' && ((github.event_name == 'workflow_dispatch' && inputs.publicar) || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="v${VN}-build${GITHUB_RUN_NUMBER}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "release/PelotaVision_${VN}_arm64.apk"
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk "release/PelotaVision_${VN}_x86_64_teste.apk"
          ( cd release && sha256sum *.apk > SHA256.txt )
          cat > notas.md <<NOTAS
          PelotaVision ${VN} (versionCode ${VC}) - commit ${SHORT}, execucao ${GITHUB_RUN_NUMBER}.

          **Para o celular:** baixe \`PelotaVision_${VN}_arm64.apk\`. O arquivo x86_64 e so para emulador.

          Assinatura conferida: certificado SHA-256 \`${PV_EXPECTED_CERT_SHA256}\` (mesma chave da 0.11.0).
          Testes e lint: ver a execucao ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Compilacao de desenvolvimento. Nao representa validacao com amostras reais.
          NOTAS
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "PelotaVision ${VN} (build ${GITHUB_RUN_NUMBER})" --notes-file notas.md --prerelease
          echo "::notice title=Release::${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
