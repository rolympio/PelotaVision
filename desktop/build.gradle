plugins { id 'java' }

version = '0.5.6'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// OpenCV Java oficial 4.12.0 (opencv-4120.jar + x64/opencv_java4120.dll).
// No CI vem do pacote oficial do Windows; localmente: -PopencvJava=C:/opencv/build/java
def opencvJava = file(findProperty('opencvJava') ?: System.getenv('OPENCV_JAVA_DIR') ?: 'opencv-java')

sourceSets { main { java.srcDirs += file('../core/src/main/java') } }

dependencies {
    implementation files("${opencvJava}/opencv-4120.jar")
    // org.json: nativo no Android; no Windows vem desta dependencia (ReportJson do nucleo).
    implementation 'org.json:json:20240303'
    // 0.5.2: relatorio PDF no Windows (Apache License 2.0; ~3 MB no pacote).
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    // 0.5.6: aceleracao por hardware opcional das redes (CUDA; sem CUDA, CPU). MIT. O pacote Windows
    // remove do jar as bibliotecas de Linux (ver windows.yml); a CUDA/cuDNN nao vai no pacote.
    implementation 'com.microsoft.onnxruntime:onnxruntime_gpu:1.31.1'
    testImplementation 'junit:junit:4.13.2'
}

// Copia as dependencias de execucao para o empacotamento (jpackage).
tasks.register('runtimeLibs', Copy) { from configurations.runtimeClasspath; into layout.buildDirectory.dir('runtime-libs') }
jar {
    archiveFileName = 'pelotavision-desktop.jar'
    manifest { attributes('Main-Class': 'br.com.pelotavision.DesktopApp', 'Class-Path': configurations.runtimeClasspath.collect { it.name }.join(' '), 'Implementation-Version': project.version) }
}

test {
    systemProperty 'java.library.path', "${opencvJava}/x64"
    systemProperty 'pelotavision.validationDir', file('../verification').absolutePath
    systemProperty 'pelotavision.modelDir', file('../app/src/main/assets').absolutePath
    systemProperty 'java.awt.headless', 'true'
    testLogging { events 'passed', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
}
