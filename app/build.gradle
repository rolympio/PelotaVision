plugins { id 'com.android.application' }
android {
    namespace 'br.com.pelotavision'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.pelotavision'
        minSdk 29
        targetSdk 35
        versionCode 26
        versionName '0.16.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // A chave de desenvolvimento NAO fica no repositorio. Localmente, copie-a para
    // signing/prototype.keystore (ignorado pelo git); no GitHub Actions ela vem do
    // segredo PV_KEYSTORE_BASE64. Senhas e alias vem de variaveis de ambiente.
    def pvKeystore = rootProject.file(System.getenv('PV_KEYSTORE_FILE') ?: 'signing/prototype.keystore')
    signingConfigs {
        debug {
            if (pvKeystore.exists()) {
                storeFile pvKeystore
                storePassword System.getenv('PV_STORE_PASSWORD') ?: (project.findProperty('pvStorePassword') ?: 'android')
                keyAlias System.getenv('PV_KEY_ALIAS') ?: (project.findProperty('pvKeyAlias') ?: 'androiddebugkey')
                keyPassword System.getenv('PV_KEY_PASSWORD') ?: (project.findProperty('pvKeyPassword') ?: 'android')
            } else {
                logger.warn('PelotaVision: signing/prototype.keystore ausente; APK sera assinado com a chave debug local e NAO atualizara instalacoes existentes.')
            }
        }
    }
    // .tflite sem compressao no APK (o LiteRT pode mapear direto; tambem acelera a copia para o cache).
    androidResources { noCompress 'tflite' }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests { includeAndroidResources = true } }
    // Nucleo de analise comum a Android e Windows (Java puro + OpenCV), em ../core.
    sourceSets { main { java.srcDirs += rootProject.file('core/src/main/java') } }
}
android.testOptions.unitTests.all {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    systemProperty 'pelotavision.validationDir', rootProject.file('verification').absolutePath
    ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore','javax.net.ssl.trustStorePassword'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'org.opencv:opencv:4.12.0'
    // 0.16.0: aceleracao por hardware opcional (Apache 2.0). API Interpreter + GpuDelegate; bibliotecas
    // nativas alinhadas a 16 KB (exigencia da Play para targetSdk 35).
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
